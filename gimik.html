<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gimik this Saturday?</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #ffe4e1;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
        }

        #container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        img {
            width: 200px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        h1 {
            color: #d63384;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }

        button {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        #yesBtn {
            background-color: #4caf50;
            color: white;
        }

        #noBtn {
            background-color: #f44336;
            color: white;
            position: relative;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div id="container">
        <div id="main-content">
            <img id="display-img" src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXN3ZzZicHdzbmJueXN3ZzZicHdzbmJueXN3ZzZicHdzbmJueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="cute cat">
            <h1 id="question">Gimik this Saturday night?</h1>
            
            <div class="buttons">
                <button id="yesBtn" onclick="celebrate()">Yes</button>
                <button id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">No</button>
            </div>
        </div>

        <div id="success-message" class="hidden">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExOHpueXN3ZzZicHdzbmJueXN3ZzZicHdzbmJueXN3ZzZicHdzbmJueSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/26AHON8E3006a8KqI/giphy.gif" alt="celebration">
            <h1>YAYYY! See you then! 🎉</h1>
        </div>
    </div>

    <script>
        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const mainContent = document.getElementById('main-content');
        const successMessage = document.getElementById('success-message');
        
        let yesSize = 18;
        let noClicks = 0;

        const messages = [
            "Are you sure?",
            "Really sure??",
            "Think again!",
            "Last chance!",
            "Surely not?",
            "You're breaking my heart ;(",
            "PLEASEEE",
            "I'm gonna cry..."
        ];

        function moveNoButton() {
            // Change the text of the "No" button
            if (noClicks < messages.length) {
                noBtn.innerHTML = messages[noClicks];
            }
            
            // Make the "Yes" button bigger
            yesSize += 15;
            yesBtn.style.fontSize = yesSize + "px";
            yesBtn.style.padding = (yesSize/2) + "px " + (yesSize) + "px";

            // Move the "No" button to a random position
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            
            noBtn.style.position = 'absolute';
            noBtn.style.left = x + 'px';
            noBtn.style.top = y + 'px';

            noClicks++;
        }

        function celebrate() {
            mainContent.classList.add('hidden');
            successMessage.classList.remove('hidden');
            // Stop the no button from floating around
            noBtn.classList.add('hidden');
        }
    </script>
</body>
</html>
